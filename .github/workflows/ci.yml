name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: fmt
        run: |
          UNFORMATTED=$(find . -name "*.go" -not -path "./.git/*" | xargs gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: test
        run: go test -race ./... -coverprofile=coverage.out -covermode=atomic

      - name: coverage gate
        run: |
          FUNC=$(go tool cover -func=coverage.out)
          TOTAL=$(echo "$FUNC" | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')
          SYNC=$(awk '
            /^mode:/ { next }
            $1 ~ /\/internal\/sync\// {
              total += $2
              if ($3 > 0) covered += $2
            }
            END {
              if (total == 0) {
                print "ERROR: no statement data for internal/sync/" > "/dev/stderr"
                exit 1
              }
              printf "%.1f", covered * 100 / total
            }
          ' coverage.out)
          echo "Total statement coverage:         ${TOTAL}%"
          echo "internal/sync statement coverage: ${SYNC}%"
          FAIL=0
          awk "BEGIN { exit !($TOTAL < 80) }" && { echo "FAIL: total ${TOTAL}% < 80%" >&2; FAIL=1; }
          awk "BEGIN { exit !($SYNC  < 80) }" && { echo "FAIL: internal/sync ${SYNC}% < 80%" >&2; FAIL=1; }
          exit $FAIL

      - name: build
        run: go build ./...

  # Rolling "main" image: built and pushed to GHCR on every push to main after
  # the ci job passes. Tracks main HEAD so users can opt into the latest fixes
  # without waiting for a tagged release. `latest` stays bound to tagged releases
  # (see release.yml); this job only ever publishes `main` and `sha-<short>`.
  docker-main:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/erichll/go-fast-note-sync
          tags: |
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=go-fast-note-sync
            org.opencontainers.image.description=Rolling build from main (edge, may be unstable)

      - id: shortsha
        name: short sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=sha-${{ steps.shortsha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
